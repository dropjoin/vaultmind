# VaultMind routing configuration — every model call goes through Otari.
#
# Two layers live in this file:
#
# 1. `roles:` — VaultMind's own routing table. The client reads it to pick a
#    model per role, enforce a local budget mirror, downgrade to the cheap
#    model once a role's budget is >= thrifty_threshold (80%) used, and fail
#    over to the fallback model on gateway errors. Each role maps to a
#    *virtual key* in the Otari dashboard (scoped, revocable, model-limited)
#    so the gateway sees the same three-role split the vault sees on-chain.
#
# 2. `gateway_policy:` — the same routing intent written in the Otari
#    routing-policy YAML shape from the official Otari docs (routing.md:
#    `select` with a `budget_used_pct: {gte: 80}` "thrifty" condition, plus
#    `on_failure` failover). It is the policy to configure on the gateway
#    side so enforcement also happens before dispatch, not only locally.
#
# Model IDs are the hosted catalog's plain `vendor/model` IDs, verified
# live against GET /api/v1/models on 2026-11-04. The blog-era spellings
# do NOT resolve on the hosted gateway: there is no `mzai:` provider
# prefix (the blog's example model is today's `moonshotai/kimi-k2.6`),
# and `openai:gpt-5-nano` / `anthropic:claude-haiku-4-5` from the routing
# docs are not in the hosted catalog at all (see NOTES.md). Prices below
# are the gateway's own per-model prices from the /models response
# (USD per 1M tokens) — the same numbers the dashboard bills from; they
# feed VaultMind's local usage ledger.

gateway:
  base_url: https://api.otari.ai/api/v1
  # The gateway enforces budgets before dispatch and refuses with
  # 403 Otari-Error-Code: budget_exceeded (docs: budgets.md). The local
  # budget mirror exists so the CLI can explain a refusal before it happens.

roles:
  proposer:
    # Drafts the justification for a proposed payment.
    virtual_key: vm-proposer
    key_env: OTARI_KEY_PROPOSER
    budget_usd: 0.50
    models:
      primary: moonshotai/kimi-k2.6
      cheap: deepseek/deepseek-v4-flash
      fallback: deepseek/deepseek-v3.2
  checker:
    # Evaluates a proposal against the on-chain policy; also runs the
    # prompt-injection guardrail review of untrusted memo text.
    virtual_key: vm-checker
    key_env: OTARI_KEY_CHECKER
    budget_usd: 0.50
    models:
      primary: moonshotai/kimi-k2.6
      cheap: deepseek/deepseek-v4-flash
      fallback: z-ai/glm-4.7
  reporter:
    # Writes the plain-language decision card. Cheapest role by design.
    virtual_key: vm-reporter
    key_env: OTARI_KEY_REPORTER
    budget_usd: 0.25
    models:
      primary: deepseek/deepseek-v4-flash
      cheap: openai/gpt-oss-20b
      fallback: moonshotai/kimi-k2.6

# Local mirror of the gateway's budget-conditional routing ("thrifty"):
# once a role has used >= 80% of its budget, route it to its cheap model.
thrifty_threshold_pct: 80

prices_usd_per_1m_tokens:
  # From the gateway's own /models pricing block, fetched live 2026-11-04.
  moonshotai/kimi-k2.6: { input: 0.75, output: 3.50 }
  deepseek/deepseek-v3.2: { input: 0.62, output: 1.85 }
  z-ai/glm-4.7: { input: 0.40, output: 1.75 }
  deepseek/deepseek-v4-flash: { input: 0.09, output: 0.18 }
  openai/gpt-oss-20b: { input: 0.03, output: 0.14 }
  default: { input: 1.00, output: 3.00 }  # unknown model: conservative estimate

# The same intent as an Otari routing policy (docs: routing.md).
gateway_policy:
  routing:
    policies:
      vaultmind:
        select:
          - when:
              budget_used_pct: { gte: 80 }
            target: deepseek/deepseek-v4-flash
          - default: moonshotai/kimi-k2.6
        on_failure:
          - deepseek/deepseek-v3.2
          - z-ai/glm-4.7
